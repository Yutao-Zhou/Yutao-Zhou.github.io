<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>访问统计偏好 · yutaozhou.com</title>
    <style>
      :root { color-scheme: light dark; font: 16px/1.65 system-ui, sans-serif; }
      body { max-width: 660px; margin: 12vh auto; padding: 24px; }
      h1 { line-height: 1.3; font-size: 28px; }
      p { opacity: .85; }
      button { font: inherit; padding: 10px 16px; margin: 8px 8px 8px 0; border-radius: 8px; border: 1px solid #888; cursor: pointer; }
      #status { padding: 16px; border: 1px solid #8886; border-radius: 8px; }
      a { color: inherit; }
    </style>
  </head>
  <body>
    <a href="/">← yutaozhou.com</a>
    <h1>访问统计偏好<br /><small>Analytics preference</small></h1>
    <p>匿名访问统计帮助了解各项目的使用情况。你可以让此浏览器不计入统计；该设置适用于此域名下的所有项目。</p>
    <p>Choose whether visits from this browser count in anonymous analytics across projects on this domain.</p>
    <p id="status" role="status" aria-live="polite"></p>
    <button id="exclude" type="button">不计入此浏览器 / Exclude this browser</button>
    <button id="include" type="button">恢复匿名统计 / Allow anonymous analytics</button>
    <p>设置保存在当前浏览器中。其他浏览器或设备需要分别设置。更改后请刷新已打开的项目页面。</p>
    <script>
      function showPreference() {
        try {
          var excluded = localStorage.getItem("umami.disabled") === "1";
          document.getElementById("status").textContent = excluded ? "当前浏览器已排除 / This browser is excluded." : "当前浏览器允许匿名统计 / Anonymous analytics is allowed in this browser.";
        } catch (_) { document.getElementById("status").textContent = "浏览器存储不可用，无法保存偏好 / Browser storage is unavailable."; }
      }
      document.getElementById("exclude").addEventListener("click", function () { try { localStorage.setItem("umami.disabled", "1"); } catch (_) {} showPreference(); });
      document.getElementById("include").addEventListener("click", function () { try { localStorage.removeItem("umami.disabled"); } catch (_) {} showPreference(); });
      showPreference();
    </script>
  </body>
</html>
